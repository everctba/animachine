<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Página crua (sem animachine) — teste da extensão</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #eef2f5; }
    h1 { margin: 0; padding: 24px; }
    .row { display: flex; gap: 16px; padding: 0 24px; }
    .box { width: 140px; height: 100px; border-radius: 10px; background: #fff; border: 2px solid #cbd5e1; }
    .box:nth-child(1) { background: #ffe0b2; }
    .box:nth-child(2) { background: #b3e5fc; }
    .box:nth-child(3) { background: #c8e6c9; }
  </style>
</head>
<body>
  <h1 id="plain-title">Página crua — sem editor embutido</h1>
  <div class="row" id="plain-row">
    <div class="box" id="box-1"></div>
    <div class="box" id="box-2"></div>
    <div class="box" id="box-3"></div>
  </div>
</body>
</html>
